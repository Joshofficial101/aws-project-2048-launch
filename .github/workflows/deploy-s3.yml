# Deploy static 2048 game to Amazon S3 (and optionally invalidate CloudFront).
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION          (e.g. us-east-1)
#   S3_BUCKET           (bucket name only, e.g. my-2048-demo)
#
# Optional:
#   CLOUDFRONT_DISTRIBUTION_ID — if set, invalidation runs after sync

name: Deploy to AWS S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront (if configured)
        env:
          CF_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_DIST" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_DIST" \
              --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set — skipping invalidation."
          fi
