<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 — AWS Portfolio Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="brand">
          <h1>2048</h1>
          <p class="tagline">
            Arrow keys or swipe to merge tiles. Reach <strong>2048</strong>.
          </p>
        </div>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span id="score" class="score-value">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Best</span>
            <span id="best" class="score-value">0</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <button type="button" id="new-game" class="btn btn-primary">
          New game
        </button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>

      <main class="board-wrap">
        <div id="grid" class="grid" role="application" aria-label="2048 game board"></div>
        <div id="overlay" class="overlay hidden" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button type="button" id="overlay-action" class="btn btn-primary">
              Continue
            </button>
          </div>
        </div>
      </main>
    </div>
    <script src="assets/game.js" type="module"></script>
  </body>
</html>
